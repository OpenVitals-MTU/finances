name: verify

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Tests
        run: dotnet test --nologo
      - name: Data valid, reports present, nothing unclassified
        run: dotnet run --project src/Finances -- check
