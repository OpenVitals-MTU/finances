name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Tests
        run: dotnet test --nologo
      - name: Data valid, reports present, nothing unclassified
        run: dotnet run --project src/Finances --nologo -- check
